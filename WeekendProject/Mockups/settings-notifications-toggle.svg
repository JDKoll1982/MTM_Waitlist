<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Segoe UI Variable, Segoe UI, sans-serif">
  <title>Settings — New-request alert toggle (off by default)</title>
  <rect width="1180" height="640" fill="#F3F3F3"/>
  <rect width="1180" height="40" fill="#FFFFFF"/><text x="20" y="26" font-size="13" font-weight="600" fill="#1B1B1B">Settings — New-request alert (per-user, off by default)</text>
  <text x="1140" y="26" font-size="11" fill="#8A8A8A" text-anchor="end">settings-notifications-toggle</text>
  <line x1="0" y1="40" x2="1180" y2="40" stroke="#E2E2E2"/>

  <rect x="48" y="64" width="1084" height="46" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="70" y="91" font-size="13" fill="#8A8A8A">🔍 Search settings</text>

  <rect x="48" y="132" width="1084" height="54" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="70" y="166" font-size="20" fill="#1B1B1B">▾</text>
  <circle cx="120" cy="159" r="14" fill="#EAF3FB"/><text x="120" y="164" font-size="12" fill="#004578" text-anchor="middle">🔔</text>
  <text x="152" y="158" font-size="15" font-weight="600" fill="#1B1B1B">Notifications</text>
  <text x="152" y="178" font-size="12" fill="#5E5E5E">Personal</text>

  <rect x="48" y="194" width="1084" height="150" rx="8" fill="#F9FAFB" stroke="#E5E5E5"/>
  <!-- toggle row -->
  <text x="72" y="230" font-size="15" font-weight="600" fill="#1B1B1B">Alert me when a new waitlist request is ready</text>
  <text x="72" y="256" font-size="13" fill="#5E5E5E">Shows a notification when a new request is submitted (packaged app only).</text>
  <!-- toggle off -->
  <rect x="1000" y="214" width="52" height="30" rx="15" fill="#D5D5D5"/>
  <circle cx="1016" cy="229" r="13" fill="#FFFFFF"/><text x="1040" y="234" font-size="12" fill="#5E5E5E" text-anchor="middle">Off</text>

  <rect x="72" y="288" width="1000" height="40" rx="8" fill="#F1F3F4"/>
  <text x="92" y="313" font-size="13" fill="#5E5E5E">This is a personal (per-user) setting, default OFF. When ON + packaged, toasts are delivered; tapping one opens the request.</text>
</svg>
