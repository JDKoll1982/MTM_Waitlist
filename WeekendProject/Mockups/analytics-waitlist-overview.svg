<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI Variable, Segoe UI, sans-serif">
  <title>Plant Manager — Waitlist analytics overview</title>
  <rect width="1180" height="760" fill="#F3F3F3"/>
  <rect width="1180" height="40" fill="#FFFFFF"/><text x="20" y="26" font-size="13" font-weight="600" fill="#1B1B1B">Waitlist Analytics (Plant Manager+)</text>
  <text x="1140" y="26" font-size="11" fill="#8A8A8A" text-anchor="end">analytics-waitlist-overview</text>
  <line x1="0" y1="40" x2="1180" y2="40" stroke="#E2E2E2"/>

  <text x="40" y="92" font-size="24" font-weight="600" fill="#1B1B1B">Waitlist Analytics</text>
  <rect x="980" y="66" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/><text x="1040" y="88" font-size="13" fill="#1B1B1B" text-anchor="middle">Last 7 days ▾</text>

  <!-- KPI tiles -->
  <g font-family="Segoe UI Variable, Segoe UI">
    <rect x="40" y="120" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="60" y="152" font-size="12" fill="#5E5E5E">Requests</text>
    <text x="60" y="196" font-size="30" font-weight="600" fill="#1B1B1B">312</text>
    <text x="60" y="218" font-size="12" fill="#5E5E5E">Coil 48 · Pickup 96 · Scrap 74</text>
    <rect x="320" y="120" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="340" y="152" font-size="12" fill="#5E5E5E">Avg fill time</text>
    <text x="340" y="196" font-size="30" font-weight="600" fill="#1B1B1B">9.4 min</text>
    <text x="340" y="218" font-size="12" fill="#107C10">▼ 12% vs prior</text>
    <rect x="600" y="120" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="620" y="152" font-size="12" fill="#5E5E5E">On-time</text>
    <text x="620" y="196" font-size="30" font-weight="600" fill="#1B1B1B">91%</text>
    <text x="620" y="218" font-size="12" fill="#C19C00">6 overdue</text>
    <rect x="880" y="120" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="900" y="152" font-size="12" fill="#5E5E5E">Cancellations</text>
    <text x="900" y="196" font-size="30" font-weight="600" fill="#1B1B1B">23</text>
    <text x="900" y="218" font-size="12" fill="#5E5E5E">see Admin monitor</text>
  </g>

  <!-- by type trend -->
  <rect x="40" y="252" width="560" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="60" y="282" font-size="14" font-weight="600" fill="#1B1B1B">Requests by type / time</text>
  <!-- simple bar sketch -->
  <rect x="80" y="330" width="40" height="60" rx="4" fill="#6E839C"/><text x="100" y="400" font-size="11" fill="#5E5E5E" text-anchor="middle">Coil</text>
  <rect x="150" y="300" width="40" height="90" rx="4" fill="#5B7C99"/><text x="170" y="400" font-size="11" fill="#5E5E5E" text-anchor="middle">Pickup</text>
  <rect x="220" y="330" width="40" height="60" rx="4" fill="#B5823E"/><text x="240" y="400" font-size="11" fill="#5E5E5E" text-anchor="middle">Scrap</text>
  <rect x="290" y="350" width="40" height="40" rx="4" fill="#5E8C5E"/><text x="310" y="400" font-size="11" fill="#5E5E5E" text-anchor="middle">Flat</text>

  <!-- handler performance -->
  <rect x="620" y="252" width="520" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="640" y="282" font-size="14" font-weight="600" fill="#1B1B1B">Handler performance</text>
  <g font-size="12">
    <text x="640" y="316" fill="#1B1B1B">M. Lewis</text><text x="760" y="316" fill="#5E5E5E">accepts 120</text><text x="1060" y="316" fill="#1B1B1B" text-anchor="end">avg 6.2 min</text>
    <text x="640" y="346" fill="#1B1B1B">A. Reyes</text><text x="760" y="346" fill="#5E5E5E">accepts 88</text><text x="1060" y="346" fill="#1B1B1B" text-anchor="end">avg 11.8 min</text>
    <text x="640" y="376" fill="#1B1B1B">S. Patel</text><text x="760" y="376" fill="#5E5E5E">accepts 76</text><text x="1060" y="376" fill="#1B1B1B" text-anchor="end">avg 9.1 min</text>
  </g>

  <!-- stock shortage -->
  <rect x="40" y="472" width="1100" height="130" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="60" y="502" font-size="14" font-weight="600" fill="#1B1B1B">Stock shortage (snapshot at request)</text>
  <text x="60" y="528" font-size="12" fill="#5E5E5E">Requests placed while on-hand &lt; requested qty (auto snapshot):</text>
  <g font-size="12">
    <text x="60" y="556" fill="#C42B1C">• MMC0001000 — 11 of 34 requests short</text>
    <text x="60" y="578" fill="#C42B1C">• MMC0002020 — 6 of 21 requests short</text>
  </g>
</svg>
