<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="Segoe UI Variable, Segoe UI, sans-serif">
  <title>Waitlist detail — Coil request shows real data (not blank)</title>
  <rect width="1180" height="780" fill="#F3F3F3"/>
  <rect width="1180" height="40" fill="#FFFFFF"/><text x="20" y="26" font-size="13" font-weight="600" fill="#1B1B1B">Waitlist detail — Coil request (real request, not blank)</text>
  <text x="1140" y="26" font-size="11" fill="#8A8A8A" text-anchor="end">waitlist-detail-coilfields</text>
  <line x1="0" y1="40" x2="1180" y2="40" stroke="#E2E2E2"/>

  <!-- hero card (rounded 16) -->
  <rect x="40" y="60" width="1100" height="150" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="64" y="84" width="100" height="100" rx="12" fill="#EAF0F7"/><rect x="88" y="108" width="52" height="20" rx="999" fill="#D4E2EF"/><text x="114" y="122" font-size="9" font-weight="700" fill="#2E3B47" text-anchor="middle">COIL</text>
  <text x="190" y="110" font-size="24" font-weight="600" fill="#1B1B1B">COIL-204</text>
  <text x="190" y="136" font-size="12" fill="#5E5E5E"><tspan font-weight="600">Requested by:</tspan> D. Vance</text>
  <text x="190" y="158" font-size="12" fill="#5E5E5E"><tspan font-weight="600">Work Center:</tspan> Press P-12</text>
  <text x="700" y="120" font-size="14" font-weight="600" fill="#107C10">Remaining time: 0:42</text>

  <text x="40" y="246" font-size="18" font-weight="600" fill="#1B1B1B">Request Details</text>

  <!-- coil section card -->
  <rect x="40" y="264" width="1100" height="230" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="64" y="292" font-size="16" font-weight="600" fill="#1B1B1B">Coil</text>
  <text x="64" y="314" font-size="12" fill="#5E5E5E">Coil to bring to Press P-12 for work order WO-4481.</text>
  <g font-size="13">
    <text x="64" y="350" font-weight="600" fill="#1B1B1B">Requested coil</text><text x="330" y="350" fill="#1B1B1B">COIL-204</text>
    <text x="620" y="350" font-weight="600" fill="#1B1B1B">Quantity in house</text><text x="886" y="350" fill="#1B1B1B">46,000 lb</text>
    <text x="64" y="384" font-weight="600" fill="#1B1B1B">Coil description</text><text x="330" y="384" fill="#1B1B1B">MMC0001000 - HRPO</text>
    <text x="620" y="384" font-weight="600" fill="#1B1B1B">Average coil weight</text><text x="886" y="384" fill="#1B1B1B">5,000 lb</text>
    <text x="64" y="418" font-weight="600" fill="#1B1B1B">Work order</text><text x="330" y="418" fill="#1B1B1B">WO-4481</text>
    <text x="620" y="418" font-weight="600" fill="#1B1B1B">Work center description</text><text x="886" y="418" fill="#1B1B1B">12 - Coil Press</text>
    <text x="64" y="452" font-weight="600" fill="#1B1B1B">Requesting user</text><text x="330" y="452" fill="#1B1B1B">D. Vance (111)</text>
    <text x="620" y="452" font-weight="600" fill="#1B1B1B">Tipping strategy</text><text x="886" y="452" fill="#1B1B1B">Crane (&lt;10 in) / Tipper</text>
  </g>

  <text x="40" y="524" font-size="12" fill="#8A8A8A">Root causes fixed: item resolves real submitted requests (not only sample) and Coil maps to the Coil template (not pickup_wip).</text>
</svg>
