<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" font-family="Segoe UI Variable, Segoe UI, sans-serif">
  <title>New Request — Job Type with current-coil banner</title>
  <rect width="1080" height="820" fill="#F3F3F3"/>
  <rect width="1080" height="40" fill="#FFFFFF"/><text x="20" y="26" font-size="13" font-weight="600" fill="#1B1B1B">Mockup</text>
  <text x="1040" y="26" font-size="11" fill="#8A8A8A" text-anchor="end">Mockups / newrequest-selection-coilbanner</text>
  <line x1="0" y1="40" x2="1080" y2="40" stroke="#E2E2E2"/>

  <text x="120" y="104" font-size="24" font-weight="600" fill="#1B1B1B">New Request - Choose Job Type</text>
  <text x="120" y="132" font-size="14" fill="#5E5E5E">Press P-12 · Work Center 12</text>

  <!-- current-coil banner (above tiles) -->
  <rect x="120" y="150" width="650" height="52" rx="10" fill="#EAF3FB" stroke="#9CC7EB"/>
  <text x="140" y="174" font-size="13" font-weight="600" fill="#004578">Current coil: COIL-204 · MMC0001000</text>
  <text x="140" y="192" font-size="12" fill="#5E5E5E">Qty in house 46,000 lb (pooled per location) · WO-4481</text>

  <text x="120" y="232" font-size="14" fill="#5E5E5E">Choose a Job Type to continue.</text>

  <g font-family="Segoe UI Variable, Segoe UI">
    <g>
      <rect x="120" y="250" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
      <rect x="158" y="266" width="74" height="74" rx="8" fill="#EAF0F7"/><rect x="180" y="288" width="30" height="30" rx="15" fill="#6E839C"/>
      <text x="195" y="308" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">C</text>
      <text x="195" y="366" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="middle">Coil</text>
      <text x="195" y="386" font-size="11" fill="#5E5E5E" text-anchor="middle">Bring / pickup</text>
    </g>
    <g>
      <rect x="286" y="250" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
      <rect x="324" y="266" width="74" height="74" rx="8" fill="#EDF1F5"/><rect x="346" y="288" width="30" height="30" rx="15" fill="#5B7C99"/>
      <text x="361" y="308" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">P</text>
      <text x="361" y="366" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="middle">Pickup</text>
      <text x="361" y="386" font-size="11" fill="#5E5E5E" text-anchor="middle">FG / NCM / WIP</text>
    </g>
    <g>
      <rect x="452" y="250" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
      <rect x="490" y="266" width="74" height="74" rx="8" fill="#F6EFE7"/><rect x="512" y="288" width="30" height="30" rx="15" fill="#B5823E"/>
      <text x="527" y="308" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">S</text>
      <text x="527" y="366" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="middle">Scrap</text>
      <text x="527" y="386" font-size="11" fill="#5E5E5E" text-anchor="middle">Remove scrap</text>
    </g>
    <g>
      <rect x="618" y="250" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
      <rect x="656" y="266" width="74" height="74" rx="8" fill="#ECF3EC"/><rect x="678" y="288" width="30" height="30" rx="15" fill="#5E8C5E"/>
      <text x="693" y="308" font-size="20" font-weight="700" fill="#FFF" text-anchor="middle">F</text>
      <text x="693" y="366" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="middle">Flatstock</text>
      <text x="693" y="386" font-size="11" fill="#5E5E5E" text-anchor="middle">Sheet / flat</text>
    </g>
  </g>

  <line x1="0" y1="744" x2="1080" y2="744" stroke="#E2E2E2"/>
  <rect x="120" y="760" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="180" y="784" font-size="14" fill="#1B1B1B" text-anchor="middle">Back</text>
</svg>
