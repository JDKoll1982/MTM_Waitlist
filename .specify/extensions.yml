installed:
- changelog
- ci-guard
- companion
- conduct
- fix-findings
- loop
- optimize
- orchestrator
- pr-bridge
- ralph
- ship
- superspec
- token-budget
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
  before_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.plan?
    description: Scope reading manifest before planning
    condition: null
  before_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.tasks?
    description: Scope reading manifest before task generation
    condition: null
  before_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.implement?
    description: Scope reading manifest before implementation
    condition: null
  - extension: superspec
    command: speckit.superspec.execute
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers-guided implementation with TDD and checkpoints?
    description: Enforce TDD discipline and Superpowers execution guidance before
      core implementation
    condition: null
  - extension: ci-guard
    command: speckit.ci-guard.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run spec compliance checks before implementation?
    description: Verify spec artifacts are complete and consistent before starting
      implementation
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit constitution changes?
    description: Auto-commit after constitution update
    condition: null
  after_specify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact spec.md to reduce tokens for /speckit.plan?
    description: Compact spec after specification
    condition: null
  - extension: companion
    command: speckit.companion.after-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-specify?
    description: Record specify completion (currentStep=specify, status=specified)
      into .spec-context.json
    condition: null
  after_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact plan and design docs to reduce tokens for /speckit.tasks?
    description: Compact plan docs after planning
    condition: null
  - extension: companion
    command: speckit.companion.after-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-plan?
    description: Record plan completion (currentStep=plan, status=planned) into .spec-context.json
    condition: null
  after_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact tasks.md to reduce tokens for /speckit.implement?
    description: Compact tasks after task generation
    condition: null
  - extension: ralph
    command: speckit.ralph.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run ralph loop to implement tasks?
    description: Start autonomous implementation after task generation
    condition: null
  - extension: loop
    command: speckit.loop.define
    enabled: true
    optional: true
    priority: 10
    prompt: Define an autonomous loop to drive these tasks to completion (maker/checker
      split, externalized state)?
    description: Set up a loop contract after task generation
    condition: null
  - extension: superspec
    command: speckit.superspec.tasks
    enabled: true
    optional: true
    priority: 10
    prompt: Run enhanced Superpowers task decomposition and validation?
    description: Verify task coverage and add Superpowers execution markers after
      core task generation
    condition: null
  - extension: companion
    command: speckit.companion.after-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-tasks?
    description: Record tasks completion (currentStep=tasks, status=ready-to-implement)
      into .spec-context.json
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  - extension: changelog
    command: speckit.changelog.generate
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.changelog.generate?
    description: Offer to generate changelog entry after implementation
    condition: null
  - extension: fix-findings
    command: speckit.fix-findings.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run fix-findings to analyze and resolve spec findings automatically?
    description: Post-implementation automated finding resolution
    condition: null
  - extension: loop
    command: speckit.loop.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run an independent checker pass on this implementation (the model that
      wrote the code should not be the one to grade it)?
    description: Adversarial maker/checker verification after implementation
    condition: null
  - extension: ship
    command: speckit.ship.run
    enabled: true
    optional: true
    priority: 10
    prompt: Ship this feature?
    description: Runs pre-flight checks, syncs branches, generates changelog, and
      creates PR
    condition: null
  - extension: superspec
    command: speckit.superspec.review
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers review against the specification and implementation?
    description: Review implementation against the spec, plan, tasks, and constitution
    condition: null
  - extension: ci-guard
    command: speckit.ci-guard.drift
    enabled: true
    optional: true
    priority: 10
    prompt: Check for spec drift after implementation?
    description: Detect any divergence between spec requirements and implemented code
    condition: null
  - extension: pr-bridge
    command: speckit.pr-bridge.generate
    enabled: true
    optional: true
    priority: 10
    prompt: Generate a pull request description from the spec artifacts?
    description: Auto-generate PR description after implementation is complete
    condition: null
  - extension: companion
    command: speckit.companion.after-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-implement?
    description: Per-task journaling on implement (currentStep=implement; status=implemented
      when all tasks checked)
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
