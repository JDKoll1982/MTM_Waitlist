installed:
- assess
- bug
- companion
- harness
- optimize
- review
- spectest
- token-budget
- wireframe
settings:
  auto_execute_hooks: true
hooks:
  before_specify:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Save the specify start time until its folder exists
    condition: null
  before_plan:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the plan start
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.plan?
    description: Scope reading manifest before planning
    condition: null
  - extension: wireframe
    command: speckit.wireframe.review
    enabled: true
    optional: true
    priority: 10
    prompt: Review and sign off wireframes before planning? (signed-off wireframes
      become spec constraints)
    description: Ensure wireframes are reviewed and signed off before plan is written
    condition: null
  before_tasks:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the tasks start
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.tasks?
    description: Scope reading manifest before task generation
    condition: null
  before_implement:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the implement start
    condition: null
  - extension: token-budget
    command: speckit.token-budget.scope
    enabled: true
    optional: true
    priority: 10
    prompt: Scope a focused reading manifest for /speckit.implement?
    description: Scope reading manifest before implementation
    condition: null
  after_specify:
  - extension: companion
    command: speckit.companion.after-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-specify?
    description: Record the specify start and finish
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact spec.md to reduce tokens for /speckit.plan?
    description: Compact spec after specification
    condition: null
  - extension: harness
    command: speckit.harness.init
    enabled: true
    optional: true
    priority: 10
    prompt: Set up a state-externalized research harness for this feature?
    description: Initialize harness state after specification
    condition: null
  - extension: wireframe
    command: speckit.wireframe.generate
    enabled: true
    optional: true
    priority: 10
    prompt: Generate wireframes for this feature now?
    description: Offer wireframe generation after spec creation
    condition: null
  after_plan:
  - extension: companion
    command: speckit.companion.after-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-plan?
    description: Record the plan finish
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact plan and design docs to reduce tokens for /speckit.tasks?
    description: Compact plan docs after planning
    condition: null
  - extension: harness
    command: speckit.harness.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Verify plan claims against primary sources and the harness evidence base?
    description: Run claim verification after planning
    condition: null
  after_tasks:
  - extension: companion
    command: speckit.companion.after-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-tasks?
    description: Record the tasks finish
    condition: null
  - extension: token-budget
    command: speckit.token-budget.compact
    enabled: true
    optional: true
    priority: 10
    prompt: Compact tasks.md to reduce tokens for /speckit.implement?
    description: Compact tasks after task generation
    condition: null
  after_implement:
  - extension: companion
    command: speckit.companion.after-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-implement?
    description: Sync implement progress from tasks.md
    condition: null
  - extension: review
    command: speckit.review.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run PR review on implemented changes?
    description: Comprehensive review after implementation
    condition: null
  - extension: spectest
    command: speckit.spectest.gaps
    enabled: true
    optional: true
    priority: 10
    prompt: Check for untested spec requirements?
    description: Scan for spec requirements with no matching tests after implementation
    condition: null
  - extension: wireframe
    command: speckit.wireframe.screenshots
    enabled: true
    optional: true
    priority: 10
    prompt: Capture implementation screenshots and compare to signed-off wireframes?
    description: 'Regression check: compare implementation to approved wireframes'
    condition: null
  before_converge:
  - extension: companion
    command: speckit.companion.before-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-converge?
    description: Record the converge start
    condition: null
  after_converge:
  - extension: companion
    command: speckit.companion.after-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-converge?
    description: Record the converge finish
    condition: null
  before_bug_assess:
  - extension: companion
    command: speckit.companion.before-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-bug?
    description: Record the bug assess start
    condition: null
  after_bug_assess:
  - extension: companion
    command: speckit.companion.after-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-bug?
    description: Record the bug assess finish and verdict
    condition: null
  before_bug_fix:
  - extension: companion
    command: speckit.companion.before-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-bug?
    description: Record the bug fix start
    condition: null
  after_bug_fix:
  - extension: companion
    command: speckit.companion.after-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-bug?
    description: Record the bug fix finish and status
    condition: null
  before_bug_test:
  - extension: companion
    command: speckit.companion.before-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-bug?
    description: Record the bug test start
    condition: null
  after_bug_test:
  - extension: companion
    command: speckit.companion.after-bug
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-bug?
    description: Record the bug test finish and result
    condition: null
