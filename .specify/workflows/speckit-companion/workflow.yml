schema_version: "1.0"
workflow:
  id: "speckit-companion"
  name: "SpecKit Companion"
  version: "1.1.0"
  author: "alfredoperez"
  description: "Companion SDD pipeline: specify → (route by size) → wireframes → plan → tasks → implement → converge, with review gates and optional wireframe sign-off."

requires:
  # Floor is the engine surface this workflow rides: `specify workflow run`/`resume`
  # plus the `command`/`gate`/`switch` step registry, present from 0.9.5. Bare floor —
  # spec-kit's stable line is long past this, so git/`uv` dev builds (`X.Y.Z.devN`)
  # already satisfy `>=0.9.5` under PEP 440; a `.dev0` suffix would only matter if
  # this floor equalled the exact line spec-kit HEAD currently builds. Keep it bare
  # unless that becomes true again — do not "restore" a `.dev0` suffix here.
  speckit_version: ">=0.9.5"
  integrations:
    # Advisory, non-exhaustive compatibility hint (the documented `any: [...]` shape).
    # The workflow runs against any integration that provides the Companion commands.
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  # Gate verdicts for a run with no terminal: `specify workflow resume <run id>
  # --input review_spec=approve`. Empty pauses the gate. Each gate has its own
  # input, because a gate keeps an approved input and would pass the next one too.
  review_spec:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_plan:
    type: string
    default: ""
    enum: ["", "approve", "reject"]

steps:
  - id: specify
    command: speckit.companion.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"

  # Read-only: prints the size specify recorded in the spec's .spec-context.json
  # (found through .specify/feature.json), or nothing when there is none.
  - id: size
    type: shell
    run: "python3 .specify/extensions/companion/scripts/status-context.py --size"

  # Routes on the recorded size; the cases are the verdicts in
  # nodes/specify/_order.yml that fold or warn. `normal`, a missing size and any
  # unknown value take `default:`, the full pipeline with review gates, so doubt
  # never skips a phase.
  - id: route
    type: switch
    expression: "{{ steps.size.output.stdout }}"
    cases:
      # `simple` is the verdict the classifier emits (presets/_parts/routing.md:
      # "`small` names the *bar*, never the verdict"). This key read `small`
      # once, so no run ever matched it and every spec took the full default.
      simple:
        # Folded path — the `specify` step above already wrote the lean plan.md
        # and tasks.md and recorded plan and tasks as complete on a `simple`
        # verdict (nodes/specify/_order.yml: `simple → folds: [plan, tasks]`).
        # Running plan and tasks again here would overwrite those files and
        # repeat the work the fold saved, so this route goes straight to
        # implement, with no review-gate pauses.
        - id: simple-implement
          command: speckit.companion.implement
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
        # A `simple` change folds plan and tasks away, so there is rarely a
        # mockup; the check is silent unless one was signed off.
        - id: simple-wireframe-check
          type: prompt
          integration: "{{ inputs.integration }}"
          continue_on_error: true
          timeout: 900
          prompt: >-
            Resolve the active feature from .specify/feature.json and read spec.md. Only when it
            carries a signed-off ## UI Mockup section, offer /speckit.wireframe.screenshots to
            capture the built UI and compare it with the approved wireframes, and report any drift
            in one line. Without a signed-off mockup, say so in one line. Never rewrite the
            signed-off wireframe, never edit spec.md, and never fail this step.
      oversized:
        # Visible warning, then the SAME full pipeline — never a silent skip.
        - id: oversized-warn
          type: shell
          run: "echo '[companion] ⚠️ Oversized change detected — running the FULL pipeline (no phase skipped).'"
        - id: oversized-review-spec
          type: gate
          message: "Oversized change. Review the generated spec before planning."
          options: [approve, reject]
          on_reject: abort
          verdict_input: review_spec
        # Optional visual sign-off. State-aware, so the node hooks the companion
        # commands already apply (`specify.finalize`, `plan.plan-doc`) cannot make
        # it ask twice: whichever runs second finds the mockup done and skips.
        - id: oversized-wireframes
          type: prompt
          integration: "{{ inputs.integration }}"
          continue_on_error: true
          timeout: 900
          prompt: >-
            Resolve the active feature from .specify/feature.json and read spec.md. If the spec
            describes a screen, form, dashboard or other visual surface and the feature's
            wireframes/ directory holds no .svg yet, run /speckit.wireframe.generate for it and then
            /speckit.wireframe.review so the operator can sign off; sign-off writes a ## UI Mockup
            section into spec.md, which the plan then honors. If wireframes exist but spec.md carries
            no ## UI Mockup section, offer /speckit.wireframe.review. If the feature has no visual
            surface, or it is already signed off, say so in one line. Never invent a wireframe, never
            edit spec.md yourself, and never fail this step.
        - id: oversized-plan
          command: speckit.companion.plan
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
        - id: oversized-review-plan
          type: gate
          message: "Review the plan before generating tasks."
          options: [approve, reject]
          on_reject: abort
          verdict_input: review_plan
        - id: oversized-tasks
          command: speckit.companion.tasks
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
        - id: oversized-implement
          command: speckit.companion.implement
          integration: "{{ inputs.integration }}"
          input:
            args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
        - id: oversized-wireframe-check
          type: prompt
          integration: "{{ inputs.integration }}"
          continue_on_error: true
          timeout: 900
          prompt: >-
            Resolve the active feature from .specify/feature.json and read spec.md. Only when it
            carries a signed-off ## UI Mockup section, offer /speckit.wireframe.screenshots to
            capture the built UI and compare it with the approved wireframes, and report any drift
            in one line. Without a signed-off mockup, say so in one line. Never rewrite the
            signed-off wireframe, never edit spec.md, and never fail this step.
    # normal (and any unresolved value) → full pipeline with review gates.
    default:
      - id: review-spec
        type: gate
        message: "Review the generated spec before planning."
        options: [approve, reject]
        on_reject: abort
        verdict_input: review_spec
      # Optional visual sign-off between the spec review and the plan.
      - id: wireframes
        type: prompt
        integration: "{{ inputs.integration }}"
        continue_on_error: true
        timeout: 900
        prompt: >-
          Resolve the active feature from .specify/feature.json and read spec.md. If the spec
          describes a screen, form, dashboard or other visual surface and the feature's wireframes/
          directory holds no .svg yet, run /speckit.wireframe.generate for it and then
          /speckit.wireframe.review so the operator can sign off; sign-off writes a ## UI Mockup
          section into spec.md, which the plan then honors. If wireframes exist but spec.md carries
          no ## UI Mockup section, offer /speckit.wireframe.review. If the feature has no visual
          surface, or it is already signed off, say so in one line. Never invent a wireframe, never
          edit spec.md yourself, and never fail this step.
      - id: plan
        command: speckit.companion.plan
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
      - id: review-plan
        type: gate
        message: "Review the plan before generating tasks."
        options: [approve, reject]
        on_reject: abort
        verdict_input: review_plan
      - id: tasks
        command: speckit.companion.tasks
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
      - id: implement
        command: speckit.companion.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
      - id: wireframe-check
        type: prompt
        integration: "{{ inputs.integration }}"
        continue_on_error: true
        timeout: 900
        prompt: >-
          Resolve the active feature from .specify/feature.json and read spec.md. Only when it
          carries a signed-off ## UI Mockup section, offer /speckit.wireframe.screenshots to capture
          the built UI and compare it with the approved wireframes, and report any drift in one line.
          Without a signed-off mockup, say so in one line. Never rewrite the signed-off wireframe,
          never edit spec.md, and never fail this step.

  # Terminal step — stock converge; its after-converge hook completes a clean spec.
  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} (workflow engine step: run this step only, the engine runs the next one)"
